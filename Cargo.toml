[package]
name = "netdisk-lfs"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
description = "自建 Git LFS 服务端，对象存储后端为百度网盘（bdpan CLI）"

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash", "getrandom"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
base64 = { version = "0.22.1", default-features = false, features = ["std"] }
clap = { version = "4.6.9", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
dotenvy = { version = "0.15.7", default-features = false }
# 会话 id 与 SaltString 同源（已在 lockfile 里，经 password-hash 引入）；直接依赖是
# 因为 argon2 的 password-hash 在本项目 feature 组合下不 re-export rand_core。
getrandom = { version = "0.4.3", default-features = false }
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
sha2 = { version = "0.11.1", default-features = false }
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "net", "signal", "macros", "fs", "io-util", "process", "sync", "time"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["io"] }
toml = { version = "1.2.2", default-features = false, features = ["parse", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "json", "ansi", "std"] }

[dev-dependencies]
# 集成测试用 `ServiceExt::oneshot` 直接打 router，不绑定端口；`util` 只为此。
tower = { version = "0.5.3", default-features = false, features = ["util"] }
# `BodyExt::collect` 读取响应体，断言 JSON 错误体与 batch 响应。
http-body-util = "0.1.5"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
explicit_iter_loop = "warn"
needless_pass_by_value = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
uninlined_format_args = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
doc_markdown = "allow"
